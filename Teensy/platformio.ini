; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags = -O3 -D ETAG_LOG_LEVEL=0 -D USB_DUAL_SERIAL
build_unflags = -O2 -D USB_SERIAL
build_type = release
lib_deps = https://github.com/bblanchon/ArduinoJson.git

[env:logger]
platform = teensy
board = teensy40
framework = arduino
build_flags = -D ETAG_LOG_LEVEL=1 -D ETAG_DEBUG -D USB_DUAL_SERIAL
build_unflags = -D USB_SERIAL
lib_deps = https://github.com/bblanchon/ArduinoJson.git

[platformio]
description = Code for the EEG containing dolphin tag
